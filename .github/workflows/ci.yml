name: ci

# Manual runs only. GitHub-hosted Windows runners consume Actions minutes
# on every execution, so this workflow is deliberately not wired to push
# or pull-request events. Trigger it from the Actions tab when a full
# build/test/publish validation is wanted; local `dotnet test` covers the
# same suite for day-to-day work.

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build fx-trading-dotnet.sln -c Release

      - name: Test
        run: dotnet test fx-trading-dotnet.sln -c Release --no-build --logger trx

      - name: Publish (self-contained)
        run: dotnet publish src/fxpa/fxpa.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxpa-win-x64
          path: publish/
